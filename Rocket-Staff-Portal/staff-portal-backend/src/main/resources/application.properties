spring.application.name=staff-portal-backend

# Shared Rocket SQLite database.
# The default path matches the Rocket-Server-2.0 project layout.
# Set ROCKET_DB_PATH to use an absolute path when needed.
spring.datasource.url=jdbc:sqlite:${ROCKET_DB_PATH:../../data/rocket_integration.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Spring reads/writes the existing shared schema but must not create or alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/London

# Keep API error responses concise.
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=always

# Rocket Email / Microsoft Graph
rocket.email.client-id=${MICROSOFT_CLIENT_ID:}
rocket.email.client-secret=${MICROSOFT_CLIENT_SECRET:}
rocket.email.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/email/microsoft/callback}
rocket.email.frontend-url=${ROCKET_STAFF_FRONTEND_URL:http://localhost:3000}
rocket.email.sender=${ROCKET_EMAIL_FROM:rocketpubserver@outlook.com}
rocket.email.token-path=${ROCKET_EMAIL_TOKEN_PATH:../../data/microsoft_email_token.json}
